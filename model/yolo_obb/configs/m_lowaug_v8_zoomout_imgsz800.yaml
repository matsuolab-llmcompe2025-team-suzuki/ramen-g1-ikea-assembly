# Issue #108 v8_zoomout_imgsz800: workspace 縮小 + reposition (上詰め) を明示的に学習
# base: v7 (imgsz 800 + geometry aug 緩和) + v8 zoom-out padding augment (元 image を canvas 上詰め 65-85% scale + Places365 bg 余白)
#
# 目的: v6 で発見した「workspace bbox が画面全体化」問題の根本対策。
# v6 の built-in geometry aug は random で薄かったので、v8 では明示的に「必ず workspace 縮小 + reposition」する augment を train image に導入。
model: m
epochs: 100
batch: 4
imgsz: 800
freeze: 0
patience: 20
optimizer: auto
mosaic: 0.5
mixup: 0.0
run_name: m_lowaug_v8_zoomout_imgsz800
seed: 42
data: data/yolo_obb/configs/dataset_v8_zoomout.yaml
workers: 2
# Geometry aug (v7 と同一、緩和済 = v8 zoom-out で明示 aug してるので built-in は控えめ)
scale: 0.6
translate: 0.2
degrees: 10.0
perspective: 0.001
