# Issue #77 v4_r45: 背景 copy-paste augmentation の ablation
# base: m_lowaug (v3 と同じ hyperparams)、data だけ v4_r45 に切替
# ざっくり内訳:
#   v4_flat: 全 skill x3 bg augment (17% move balance 保持、control run)
#   v4_r40:  move_to_table x2 bg (39% ratio)
