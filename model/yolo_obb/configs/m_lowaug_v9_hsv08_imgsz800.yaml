# Issue #108 v9_hsv08_imgsz800: v8_bg + hsv_v 0.8 (光条件 augment 境界域)
# base: v8_bg + hsv_v 0.4 (default) -> 0.8
# 目的: 明度 vary の強めエッジで学習効果検証 (pilot で 0.8 は白飛び境界だが hard train sample)
model: m
epochs: 100
batch: 4
imgsz: 800
freeze: 0
patience: 20
optimizer: auto
mosaic: 0.5
mixup: 0.0
run_name: m_lowaug_v9_hsv08_imgsz800
seed: 42
data: data/yolo_obb/configs/dataset_v8_bg.yaml
workers: 2
scale: 0.6
translate: 0.2
degrees: 10.0
perspective: 0.001
fliplr: 0.0        # default 0.5 → 0.0 (hand_right/left 学習破壊 回避、v8_bg_clean 継承)
erasing: 0.0       # default 0.4 → 0.0 (object 消失 回避、v8_bg_clean 継承)
hsv_v: 0.8         # 境界域 (白飛び境界)、hard train pattern
