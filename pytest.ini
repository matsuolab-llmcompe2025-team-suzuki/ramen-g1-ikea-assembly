[pytest]
# project root を sys.path に加える (inference.desktop.X の import 解決用)。
# _deprecated/_old_vit_planner/tests/ は古い import path (`from inference._old_vit_planner...`)
# を持ち bare `pytest` で collection error になる、third_party/ は Unitree SDK clone
# (外部 code) なので除外。
norecursedirs = _deprecated third_party
pythonpath = .

# Custom marks. `integration` は heavy dep (lerobot / isaac-gr00t / cuda + GPU) を
# 要する test に付ける。default env / runtime env の CI では自動 skip、
# `pytest -m integration` で明示的に走らせる (Sakura H100 想定、Issue #125)。
markers =
    integration: mark test that requires GPU + external ML deps (skip in default CI)
    requires_boundary: test of the organizer venue path; skipped when inference/desktop/boundary/ is absent (conftest.py, Issue #190)
