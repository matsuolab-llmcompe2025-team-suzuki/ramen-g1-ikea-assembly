# YOLO OBB dataset config (Issue #108 v8_bg)
# v8 stack (元 + v5_material chroma-key + v8_zoomout padding) に v4_flat bg augment (Places365 workspace 差替) を追加。
# ablation 目的: v8 環境で bg augment の追加効果 (mAP50-95 加算 or 重複) を検証。
# val は元 fully-fixed 10 枚維持 (v3/v4/v5/v6/v7/v8 と同一 val で fair 比較)。
path: /home/ubuntu/work_dir/iros/iros_2026_ramen/data/yolo_obb
train:
  - dataset/images/train
  - augmentation/synthetic/v5_material_random/images
  - augmentation/synthetic/v8_zoomout_random/images
  - augmentation/synthetic/v4_flat/images
val: dataset/images/val

nc: 7
names:
  0: workspace
  1: leg
  2: leg_tip
  3: hole
  4: table_top
  5: hand_right
  6: hand_left
