services:
  ramen_inference:
    build: .
    image: ramen-inference:humble
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - HEAD_CAMERA_DEVICE=${HEAD_CAMERA_DEVICE:-/dev/v4l/by-id/usb-STYT_260320_K_USB_Camera_01.00.00-video-index0}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      # Bind the host /dev tree so hot-plugged /dev/videoN targets remain
      # visible together with their stable /dev/v4l/by-id symlinks.  The
      # service is already privileged for Unitree/USB access.
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace
    command: bash
